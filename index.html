<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আইসিটি অনলাইন পরীক্ষা</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Container -->
    <div id="login-container" class="card">
        <h2>আইসিটি অনলাইন পরীক্ষা</h2>
        <p>দয়া করে আপনার নাম এবং রোল নম্বর দিয়ে পরীক্ষায় অংশগ্রহণ করুন।</p>
        <form id="studentForm">
            <input type="text" id="studentName" placeholder="আপনার পুরো নাম লিখুন" required>
            <input type="text" id="rollNumber" placeholder="আপনার রোল নম্বর লিখুন" required>
            <button type="submit" class="btn">পরীক্ষা শুরু করুন</button>
        </form>
    </div>

    <!-- Exam Container (Shob proshno ekhane ek shathe thakbe) -->
    <div id="exam-container" class="card hidden">
        <div class="exam-header">
            <span id="student-info-display"></span>
            <div class="timer-box">সময় বাকি: <span id="time">25:00</span></div>
        </div>
        
        <div id="all-questions-box">
            <!-- Questions dynamically load hobe -->
        </div>

        <button id="submit-exam-btn" class="btn">পরীক্ষা জমা দিন</button>
    </div>

    <!-- Result Container -->
    <div id="result-container" class="card hidden">
        <h2>পরীক্ষার ফলাফল</h2>
        <p id="score-display"></p>
        <div id="review-box"></div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
